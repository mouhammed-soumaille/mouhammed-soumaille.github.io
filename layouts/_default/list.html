{{ define "main" }}
<div class="page">
  <a class="back" href="{{ "/" | relURL }}">← Home</a>
  <h1>{{ .Title }}</h1>
  <ul class="post-list">
    {{ range .Pages }}
    <li>
      <div class="date">{{ .Date.Format "Jan 2, 2006" }}</div>
      <a class="title" href="{{ .RelPermalink }}">{{ .Title }}</a>
      <p>{{ .Summary | plainify | truncate 180 }}</p>
    </li>
    {{ else }}
    <li><p>Nothing here yet.</p></li>
    {{ end }}
  </ul>
</div>
{{ end }}
