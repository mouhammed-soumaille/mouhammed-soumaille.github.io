{{ define "main" }}
<header class="page-head">
  <div class="page-head-inner"><h1>{{ .Title }}</h1></div>
</header>
<main class="paper">
  <ul class="post-list">
    {{ range .Pages }}
    <li>
      <span class="when">{{ .Date.Format "Jan 2006" }}</span>
      <div><a class="title" href="{{ .RelPermalink }}">{{ .Title }}</a><p>{{ .Summary | plainify | truncate 180 }}</p></div>
    </li>
    {{ else }}
    <li><p>Nothing here yet.</p></li>
    {{ end }}
  </ul>
</main>
{{ end }}
