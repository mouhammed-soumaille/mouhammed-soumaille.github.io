{{ define "main" }}
<script src="{{ "js/polytopes.js" | relURL }}?v={{ now.Unix }}" defer></script>
<header class="page-head">
  <div class="page-head-inner">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="page-intro">{{ . }}</div>{{ end }}
  </div>
</header>
<main class="paper">
  {{ range hugo.Data.lab }}
  <section class="sec lab-item" id="{{ .title | urlize }}">
    <h2>{{ .title }}</h2>
    <div class="body">
      {{ with .desc }}<p class="lab-desc">{{ . | markdownify }}</p>{{ end }}
      <figure class="fig" data-fig="{{ .figure }}"><div class="fig-stage fig-{{ .figure }}"></div></figure>
      {{ with .explain }}
      <details class="explain" open>
        <summary>How it works</summary>
        <div class="explain-body">{{ . | markdownify }}</div>
      </details>
      {{ end }}
    </div>
  </section>
  {{ end }}
</main>
{{ end }}
