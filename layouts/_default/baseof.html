<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{ if .IsHome }}{{ site.Params.name }}{{ else }}{{ .Title }} | {{ site.Params.name }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<meta property="og:title" content="{{ if .IsHome }}{{ site.Params.name }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{ "og.png" | absURL }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23202B35'/><text x='32' y='43' text-anchor='middle' font-family='Georgia,serif' font-size='30' fill='white'>MS</text></svg>">
<link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
{{ partial "header.html" . }}
<main id="content" class="container">
{{ block "main" . }}{{ end }}
</main>
<footer class="foot">
  <div class="container foot-inner">
    <span>© {{ now.Year }} {{ site.Params.name }} · Last updated {{ site.Params.lastUpdated }}</span>
    <span class="foot-links">
      <a href="mailto:{{ site.Params.email }}">Email</a>
      {{ with site.Params.github }}<a href="{{ . }}">GitHub</a>{{ end }}
      {{ with site.Params.linkedin }}<a href="{{ . }}">LinkedIn</a>{{ end }}
    </span>
  </div>
</footer>
<script>
  // Hidden terminal: typing "lain" or "sudo" anywhere on the page opens /tty/.
  (function () {
    var typed = '';
    document.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey || e.key.length !== 1) return;
      typed = (typed + e.key.toLowerCase()).slice(-8);
      if (/(lain|sudo)$/.test(typed)) window.location.href = '{{ "tty/" | relURL }}';
    });
  })();
</script>
</body>
</html>
