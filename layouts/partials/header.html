<header class="top">
  <div class="container top-inner">
    <a class="brand" href="{{ "/" | relURL }}">{{ site.Params.name }}</a>
    <nav aria-label="Main">
      {{ if hugo.Data.research }}<a href="{{ "/#research" | relURL }}">Research</a>{{ end }}
      {{ if hugo.Data.projects }}<a href="{{ "/#projects" | relURL }}">Projects</a>{{ end }}
      {{ if hugo.Data.notes }}<a href="{{ "/#notes" | relURL }}">Notes</a>{{ end }}
      {{ if hugo.Data.teaching }}<a href="{{ "/#teaching" | relURL }}">Teaching</a>{{ end }}
      {{ if hugo.Data.education }}<a href="{{ "/#education" | relURL }}">Education</a>{{ end }}
      <a href="{{ site.Params.cv | relURL }}">CV&nbsp;↗</a>
    </nav>
  </div>
</header>
