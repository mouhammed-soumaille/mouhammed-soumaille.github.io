<svg viewBox="0 0 520 205" role="img" aria-label="Two disjoint arcs of length 3 on a circle of 8 positions" xmlns="http://www.w3.org/2000/svg"><style>.ink{stroke:var(--ink);fill:none}.acc{stroke:var(--accent);fill:none}.acc2{stroke:var(--accent-2);fill:none}.mut{stroke:var(--muted);fill:none}.rule{stroke:var(--rule);fill:none}.fink{fill:var(--ink)}.facc{fill:var(--accent)}.facc2{fill:var(--accent-2)}.fbg{fill:var(--bg)}.fsurf{fill:var(--surface)}text{font-family:var(--sans);fill:var(--ink);font-size:13px}.small{font-size:12px;fill:var(--muted)}.lab{font-size:12px}</style><circle cx="150" cy="110" r="78" class="rule" stroke-width="1.4"/><path d="M94.8 54.8 A78 78 0 0 1 205.2 54.8" class="acc" stroke-width="7" stroke-linecap="round" opacity=".45"/><path d="M228.0 110.0 A78 78 0 0 1 150.0 188.0" class="acc2" stroke-width="7" stroke-linecap="round" opacity=".45"/><circle cx="150.0" cy="32.0" r="13" class="facc" style="stroke:var(--accent);stroke-width:1.4"/><text x="150.0" y="36.5" text-anchor="middle" class="lab" style="fill:var(--accent-ink)">0</text><circle cx="205.2" cy="54.8" r="13" class="facc" style="stroke:var(--accent);stroke-width:1.4"/><text x="205.2" y="59.3" text-anchor="middle" class="lab" style="fill:var(--accent-ink)">1</text><circle cx="228.0" cy="110.0" r="13" class="facc2" style="stroke:var(--accent-2);stroke-width:1.4"/><text x="228.0" y="114.5" text-anchor="middle" class="lab" style="fill:var(--bg)">2</text><circle cx="205.2" cy="165.2" r="13" class="facc2" style="stroke:var(--accent-2);stroke-width:1.4"/><text x="205.2" y="169.7" text-anchor="middle" class="lab" style="fill:var(--bg)">3</text><circle cx="150.0" cy="188.0" r="13" class="facc2" style="stroke:var(--accent-2);stroke-width:1.4"/><text x="150.0" y="192.5" text-anchor="middle" class="lab" style="fill:var(--bg)">4</text><circle cx="94.8" cy="165.2" r="13" class="fsurf" style="stroke:var(--ink);stroke-width:1.4"/><text x="94.8" y="169.7" text-anchor="middle" class="lab">5</text><circle cx="72.0" cy="110.0" r="13" class="fsurf" style="stroke:var(--ink);stroke-width:1.4"/><text x="72.0" y="114.5" text-anchor="middle" class="lab">6</text><circle cx="94.8" cy="54.8" r="13" class="facc" style="stroke:var(--accent);stroke-width:1.4"/><text x="94.8" y="59.3" text-anchor="middle" class="lab" style="fill:var(--accent-ink)">7</text><text x="270" y="96">arc {7, 0, 1}</text><circle cx="258" cy="92" r="6" class="facc"/><text x="270" y="124">arc {2, 3, 4}</text><circle cx="258" cy="120" r="6" class="facc2"/><text x="250" y="156" class="small">disjoint, so an intersecting family</text><text x="250" y="172" class="small">can contain at most one of them</text></svg>