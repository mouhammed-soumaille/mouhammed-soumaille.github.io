<svg viewBox="0 0 570 215" role="img" aria-label="An outside player beating every member of a group of three" xmlns="http://www.w3.org/2000/svg"><style>.ink{stroke:var(--ink);fill:none}.acc{stroke:var(--accent);fill:none}.acc2{stroke:var(--accent-2);fill:none}.mut{stroke:var(--muted);fill:none}.rule{stroke:var(--rule);fill:none}.fink{fill:var(--ink)}.facc{fill:var(--accent)}.facc2{fill:var(--accent-2)}.fbg{fill:var(--bg)}.fsurf{fill:var(--surface)}text{font-family:var(--sans);fill:var(--ink);font-size:13px}.small{font-size:12px;fill:var(--muted)}.lab{font-size:12px}</style><rect x="250" y="20" width="200" height="180" rx="14" class="rule" stroke-width="1.4" stroke-dasharray="5 4"/><text x="350" y="42" text-anchor="middle" class="small">a group K of k = 3 players</text><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--accent)"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker></defs><line x1="315.0" y1="85.0" x2="385.0" y2="85.0" class="mut" stroke-width="1.8" marker-end="url(#am)"/><line x1="391.7" y1="97.5" x2="358.3" y2="147.5" class="mut" stroke-width="1.8" marker-end="url(#am)"/><line x1="341.7" y1="147.5" x2="308.3" y2="97.5" class="mut" stroke-width="1.8" marker-end="url(#am)"/><line x1="124.9" y1="108.0" x2="285.1" y2="87.0" class="acc" stroke-width="1.8" marker-end="url(#ah)"/><line x1="124.9" y1="108.7" x2="385.1" y2="86.3" class="acc" stroke-width="1.8" marker-end="url(#ah)"/><line x1="124.7" y1="113.1" x2="335.3" y2="156.9" class="acc" stroke-width="1.8" marker-end="url(#ah)"/><circle cx="110.0" cy="110.0" r="15" class="facc" style="stroke:var(--accent);stroke-width:1.4"/><text x="110.0" y="114.5" text-anchor="middle" class="lab" style="fill:var(--accent-ink)">v</text><circle cx="300.0" cy="85.0" r="13" class="fsurf" style="stroke:var(--ink);stroke-width:1.4"/><text x="300.0" y="89.5" text-anchor="middle" class="lab">a</text><circle cx="400.0" cy="85.0" r="13" class="fsurf" style="stroke:var(--ink);stroke-width:1.4"/><text x="400.0" y="89.5" text-anchor="middle" class="lab">b</text><circle cx="350.0" cy="160.0" r="13" class="fsurf" style="stroke:var(--ink);stroke-width:1.4"/><text x="350.0" y="164.5" text-anchor="middle" class="lab">c</text><text x="110" y="150" text-anchor="middle" class="small">an outside player</text><text x="110" y="166" text-anchor="middle" class="small">who beats all of K</text><text x="480" y="100" class="small">each arrow</text><text x="480" y="116" class="small">is a coin flip</text></svg>