<svg viewBox="0 0 640 215" role="img" aria-label="Why every colouring of K6 has a one-colour triangle" xmlns="http://www.w3.org/2000/svg"><style>.ink{stroke:var(--ink);fill:none}.acc{stroke:var(--accent);fill:none}.acc2{stroke:var(--accent-2);fill:none}.mut{stroke:var(--muted);fill:none}.fsurf{fill:var(--surface)}.facc{fill:var(--accent)}text{font-family:var(--sans);fill:var(--ink);font-size:13px}.small{font-size:12px;fill:var(--muted)}.lab{font-size:12px}</style><line x1="90" y1="110" x2="150" y2="40" class="mut" stroke-width="1.4" stroke-dasharray="3 4"/><line x1="90" y1="110" x2="150" y2="180" class="mut" stroke-width="1.4" stroke-dasharray="3 4"/><line x1="90" y1="110" x2="250" y2="45" class="acc" stroke-width="2.6"/><line x1="90" y1="110" x2="300" y2="110" class="acc" stroke-width="2.6"/><line x1="90" y1="110" x2="250" y2="175" class="acc" stroke-width="2.6"/><line x1="250" y1="45" x2="300" y2="110" class="ink" stroke-width="1.6" stroke-dasharray="2 5"/><line x1="300" y1="110" x2="250" y2="175" class="ink" stroke-width="1.6" stroke-dasharray="2 5"/><line x1="250" y1="175" x2="250" y2="45" class="ink" stroke-width="1.6" stroke-dasharray="2 5"/><circle cx="150" cy="40" r="13" class="fsurf" style="stroke:var(--ink);stroke-width:1.4"/><text x="150" y="44.5" text-anchor="middle" class="lab"></text><circle cx="150" cy="180" r="13" class="fsurf" style="stroke:var(--ink);stroke-width:1.4"/><text x="150" y="184.5" text-anchor="middle" class="lab"></text><circle cx="90" cy="110" r="13" class="facc" style="stroke:var(--accent);stroke-width:1.4"/><text x="90" y="114.5" text-anchor="middle" class="lab" style="fill:var(--accent-ink)">v</text><circle cx="250" cy="45" r="13" class="fsurf" style="stroke:var(--ink);stroke-width:1.4"/><text x="250" y="49.5" text-anchor="middle" class="lab">a</text><circle cx="300" cy="110" r="13" class="fsurf" style="stroke:var(--ink);stroke-width:1.4"/><text x="300" y="114.5" text-anchor="middle" class="lab">b</text><circle cx="250" cy="175" r="13" class="fsurf" style="stroke:var(--ink);stroke-width:1.4"/><text x="250" y="179.5" text-anchor="middle" class="lab">c</text><text x="345" y="70">3 of v's 5 edges share a colour (solid)</text><text x="345" y="100">if any edge of the triangle abc has</text><text x="345" y="117">that colour, there is a one-colour triangle;</text><text x="345" y="147">if none does, abc is a triangle</text><text x="345" y="164">in the other colour</text></svg>