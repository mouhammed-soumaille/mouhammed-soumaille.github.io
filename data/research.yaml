- when: "Fall 2026 – present"
  title: "Choosing Between Truth Probes Without Labels"
  org: "Independent research"
  desc: "When several linear truth probes are equally accurate on validation data, which one should you trust? I'm testing whether checking that a probe answers a statement and its negation consistently, which needs no labels, can pick out the probes that actually track truth. A follow-up to my [truth probes project](#do-linear-truth-probes-generalize)."

- when: "Fall 2025 – Spring 2026"
  title: "Heavy-Tailed Financial Risk"
  org: "Research Assistant, AUB · Advisors: Prof. Ibrahim Abou Faycal, Prof. Jihad Fahs"
  # links:                      # uncomment when public
  #   - name: Report
  #     url: /elqb-report.pdf
  bullets:
    - "Developed the **Extreme Loss Quantile Bound (ELQB)**, a spectral risk measure for extreme losses under heavy tails, and proved its coherence, finiteness, and limiting behavior."
