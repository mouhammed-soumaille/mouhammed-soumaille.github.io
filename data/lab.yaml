# Interactive demos on the Lab page. figure = one of: ramsey, means, probe, tails, polytope, retrieval,
# ep-classes, ep-flow, ep-free, ep-sic (entanglement polytopes, from js/polytopes.js)
- title: "Entanglement polytopes I: the polytopes"
  figure: "ep-classes"
  desc: "A four-part series following my notes on how entanglement polytopes are computed, from my [quantum error correction research](/research/#quantum-error-correction). Everything is for three qubits, where all the polytopes are known exactly, so you can watch each algorithm get the right answer. Each point below is the list of largest eigenvalues of the three one-qubit states, and each entanglement class fills its own polytope."
  explain: |
    **What the picture shows.** Take a pure state of three qubits and look at one qubit on its own. Its state is a 2×2 density matrix ρ⁽ⁱ⁾ with two eigenvalues, λᵢ ≥ 1 − λᵢ. If λᵢ = 1 the qubit is not entangled with the other two at all; if λᵢ = ½ it is as entangled with them as it can be. So the point (λ₁, λ₂, λ₃) is a summary of how entangled each qubit is, built only from single-qubit information, which is exactly what is easy to measure in a lab.

    **Entanglement classes.** Two states are in the same SLOCC class if each can be turned into the other with some nonzero probability using only local operations, one invertible 2×2 matrix per qubit: g₁ <span class="op">⊗</span> g₂ <span class="op">⊗</span> g₃. Three qubits have six classes: product, three biseparable ones (one qubit on its own, the other two entangled), W and GHZ.

    **The polytope of a class.** Collect the points (λ₁, λ₂, λ₃) of every state in a class, plus their limits. A theorem about moment maps says the result is always a convex polytope. For three qubits you can see all of them here: product states give a single corner (1, 1, 1), biseparable states three edges, the W class a tetrahedron and the GHZ class the whole bipyramid Δ. The polytopes are nested the same way the classes are: W sits inside GHZ.

    **Algorithm 1: using a polytope as a test.** Deciding the class of a state directly is hard. The polytope gives a shortcut:
    1. compute the three one-qubit density matrices of the state (a partial trace);
    2. take their largest eigenvalues to get the point λ;
    3. check λ against the known inequalities of the class. For W the important one is λ₁ + λ₂ + λ₃ ≥ 2 (the shaded plane).

    One violated inequality proves the state is not in that class or its closure. Passing proves nothing, because the polytopes overlap: a GHZ-class state can land inside the W tetrahedron. In the GHZ sample, the highlighted dots below the plane are the states the test certifies as "not W".
- title: "Entanglement polytopes II: gradient flow"
  figure: "ep-flow"
  desc: "Algorithm 6 slides a state through its SLOCC orbit towards the origin, and Algorithm 2 turns where it stops into an inequality for the whole polytope."
  explain: |
    **What we are looking for.** The point of the class's polytope that is closest to the centre O = (½, ½, ½), where every qubit is maximally mixed. Why that point? The polytope is convex, so if λ* is its closest point to O, the plane through λ* at right angles to the segment from O has the whole polytope on one side (think of the nearest point on a ball to someone standing outside it). That plane is a linear inequality satisfied by every state in the class: ⟨λ − O, λ* − O⟩ ≥ ⟨λ* − O, λ* − O⟩.

    **How the flow finds it (Algorithm 6).** We cannot search the polytope directly, only the states, so we move the state instead:
    1. for each qubit, Hᵢ = ρ⁽ⁱ⁾ − I/2 measures how far that qubit is from maximally mixed;
    2. gᵢ = exp(−η Hᵢ) shrinks the direction where ρ⁽ⁱ⁾ has too much weight and boosts the other one;
    3. apply g₁ <span class="op">⊗</span> g₂ <span class="op">⊗</span> g₃ and renormalise. Each gᵢ is invertible, so the state never leaves its SLOCC class;
    4. f = Σ tr(Hᵢ²) is the squared distance to O. It goes down at every step (the plot on the right), and we stop when it stops changing.

    **Where it stops.** A W-class state cannot make all three qubits maximally mixed: the best it can do is (⅔, ⅔, ⅔), the W state itself. A GHZ-class state can, so its flow runs all the way to O and gives no information.

    **Algorithm 2: checking and cashing in.** Proposition 2.1 says the end point really is the closest point when the state is an eigenvector of X = Σᵢ ρ⁽ⁱ⁾ (each ρ⁽ⁱ⁾ acting on its own qubit). The demo computes ‖X|ψ⟩ − c|ψ⟩‖, which comes out around 10⁻⁵. Then the inequality above, with λ* = (⅔, ⅔, ⅔), simplifies to λ₁ + λ₂ + λ₃ ≥ 2: exactly the bottom face of the W tetrahedron, found from a single point.
- title: "Entanglement polytopes III: free states"
  figure: "ep-free"
  desc: "For free states the closest point is a linear system, and Algorithm 4 gets an inner and an outer approximation from a single support."
  explain: |
    **Why free states.** The flow is numerical and needs a good starting state. For free states the same questions become exact algebra.

    **Free means no off-diagonal terms.** Write |ψ⟩ = Σ cⱼ |j⟩ over basis strings j like 001. The state is free if any two strings in its support differ in at least two positions. An off-diagonal entry of ρ⁽ⁱ⁾ needs two strings that differ only in position i, so for a free state every ρ⁽ⁱ⁾ is diagonal, and its eigenvalues are just sums of the weights pⱼ = |cⱼ|². No diagonalising at all.

    **Algorithm 3: the closest point is a linear system.** Proposition 2.4 turns "λ is the closest point to O" into equations on the weights. Let Aᵣₛ count the positions where strings r and s agree. Then we need A p = c·(1, …, 1) with Σ pᵣ = 1 and every pᵣ > 0. For the W support {001, 010, 100}, A has 3s on the diagonal and 1s elsewhere, so p = (⅓, ⅓, ⅓) and λ* = (⅔, ⅔, ⅔): the same answer as the flow, now exact.

    **Algorithm 4: two approximations from one support.** If the support is small enough (#S ≤ Σ(rᵢ − 1), Theorem 2.1), then deleting terms from the state keeps you inside the closure of its class. So:
    1. every single string |j⟩ is a product state, which gives the corner (1, 1, 1);
    2. every subset T of the support gives another state in the closure, and Algorithm 3 gives its closest point. All of these points are in the polytope, so their convex hull is an **inner approximation**;
    3. the full support S gives the closest point of the class itself, and with it an **outer inequality**, as in the flow demo.

    For W the inner points are (1, 1, 1), the three points (1, ½, ½) and (⅔, ⅔, ⅔). Their hull is the tetrahedron, and the outer inequality is its bottom face. Inner and outer meet, so the polytope is computed exactly. Try the GHZ support (the closest point is O, so no inequality) or a support that is not free.
- title: "Entanglement polytopes IV: semi-interactive computation"
  figure: "ep-sic"
  desc: "Algorithm 8 puts the pieces together: check vertices with the extended flow and cut off the ones that are not reachable."
  explain: |
    **The idea.** Keep an outer approximation (a list of inequalities) and test its corners. Every true polytope lies inside the outer one, so if every corner of the outer polytope really belongs to the class, the two are equal and we are done.

    **The loop (Algorithm 8).**
    1. Compute the vertices of the current outer polytope. We start from the 9 inequalities of the full polytope Δ, which has 5 vertices.
    2. Pick a vertex q that has not been confirmed yet.
    3. **Algorithm 7:** run the flow again, but aim it at q instead of O: each step pushes the qubits' spectra towards the target spectra (qᵢ, 1 − qᵢ) while staying in the class.
    4. If the flow reaches q, then q is in the polytope: confirm it.
    5. If it gets stuck at some λ*, the convexity argument from the flow demo gives a plane separating q from the polytope: ⟨λ − q, λ* − q⟩ ≥ ⟨λ* − q, λ* − q⟩. The numbers are numerical, so we round them to simple fractions and check by hand that the rounded inequality is really true. That human step is why the method is called semi-interactive. Add it to the list and go back to step 1.

    **What happens for W.** The corner (1, 1, 1) is reachable (product states are limits of W-class states), and so are the three corners like (1, ½, ½) (a qubit on its own next to an entangled pair is also a limit). The corner O is not: the flow stalls at (⅔, ⅔, ⅔), and the separating plane rounds to λ₁ + λ₂ + λ₃ ≥ 2. Adding it cuts off O, the new outer polytope is the tetrahedron, all four of its corners are already confirmed, and the computation stops.

    The flow only approaches corners on the boundary in the limit, so "reached" means "within a small tolerance". In the real computation this is the delicate part.
